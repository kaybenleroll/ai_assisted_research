[default]
locale = "en-gb"
check-filename = false
# Markdown code fences contain copied commands and identifiers, not authored prose.
# Inline code likewise preserves exact API names and shell syntax.
# Maths notation is symbolic and may contain identifiers that look like words.
# Markdown link targets are URLs or paths and must retain their spelling.
# An explicit ignore-line marker marks copied text for human review.
extend-ignore-re = [
  '''(?ms)^\s*```[^\n]*\n.*?^\s*```[^\n]*''',
  '''(?ms)^\s*~~~[^\n]*\n.*?^\s*~~~[^\n]*''',
  '''`[^`\n]+`''',
  '''(?s)\$\$.*?\$\$''',
  '''\$[^$\n]+\$''',
  '''\]\([^)\n]+\)''',
  '''(?m)^.*<!-- typos: ignore-line -->.*$''',
]

[default.extend-words]
# "Behavior" is preserved in the exact title of the cited Generative Agents paper.
Behavior = "Behavior"
# "ACI" is the named Agent-Computer Interface pattern introduced by SWE-agent.
ACI = "ACI"
# "Center" is part of the official product name "ChatGPT Help Center".
Center = "Center"
