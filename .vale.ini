StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = House
TokenIgnores = (\$[^$\n]+\$)
BlockIgnores = (?s)(\$\$.*?\$\$)
House.FillerCluster = NO
House.WeaselWords = NO

[docs/review-checklist.md]
House.Hedging = NO

[primer_evaluation_loop/*.md]
House.FillerCluster = suggestion

[primer_numerical_analysis/*.md]
House.FillerCluster = suggestion

[gaming_silo_rpg/*.md]
# Silo headings carry manual numeric prefixes; Vale's title matcher treats the
# prefix as a word and reports false HeadingCase/HeadingMinor findings. The
# Silo heading row was reviewed manually before these files entered the
# manifest.
House.HeadingCase = NO
House.HeadingMinor = NO

[primer_complex_analysis/*.md]
# Pandoc solution headings carry an attribute block; Vale includes the block
# in its title matcher and reports false HeadingCase findings. The heading
# row was reviewed with a fence-aware source scan before manifest enrolment.
House.HeadingCase = NO
House.HeadingMinor = NO

[primer_comparative_religion/*.md]
House.WeaselWords = suggestion

[primer_political_systems/*.md]
House.WeaselWords = suggestion

[primer_military_structure/*.md]
House.WeaselWords = suggestion

[lint/fixtures/vale/*.md]
House.FillerCluster = suggestion
House.WeaselWords = suggestion
