name: Weekly external links

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      OCI: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Report external links
        run: |
          mkdir -p .scratch
          just lint-links-online > .scratch/lychee-online-report.txt 2>&1
          sed -n '1,240p' .scratch/lychee-online-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lychee-online-report
          path: .scratch/lychee-online-report.txt
          if-no-files-found: warn
