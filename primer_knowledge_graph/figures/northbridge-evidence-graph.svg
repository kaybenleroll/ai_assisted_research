<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Northbridge evidence graph for Q4</title>
  <desc id="desc">The register passage supports c1, which affirms that Travel Policy v1 applies to Atlas from 1 January to the exclusive end of 1 April 2024. The minutes passage supports c5, which denies the same proposition on 15 March 2024 with an unknown end. For Q4 on 15 March the sources disagree and the answer policy withholds an applicability conclusion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/></marker>
  </defs>
  <rect width="1000" height="570" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#172033" text-anchor="middle">
    <text x="500" y="32" font-size="21" font-weight="bold">Q4: evidence for 15 March 2024</text>
    <g fill="#f3f6fa" stroke="#53657c" stroke-width="2">
      <rect x="35" y="52" width="400" height="76" rx="8"/>
      <rect x="565" y="52" width="400" height="76" rx="8"/>
    </g>
    <g font-size="16">
      <text x="235" y="77" font-weight="bold">Register R1, first sentence</text>
      <text x="235" y="100">Version 1 applies from 1 January until 1 April</text>
      <text x="765" y="77" font-weight="bold">Minutes M1, second sentence</text>
      <text x="765" y="100">Version 1 does not apply on 15 March</text>
    </g>
    <g stroke="#344054" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M235 128 V168"/><path d="M765 128 V168"/>
      <path d="M235 282 L400 324"/><path d="M765 282 L600 324"/>
      <path d="M500 396 V445"/>
    </g>
    <g fill="#eaf2fa" stroke="#365779" stroke-width="2">
      <rect x="35" y="170" width="400" height="112" rx="8"/>
      <rect x="565" y="170" width="400" height="112" rx="8"/>
    </g>
    <g font-size="16">
      <text x="235" y="195" font-weight="bold">c1 — affirmation (+)</text>
      <text x="235" y="220">Support: 1 January to 1 April, exclusive</text>
      <text x="235" y="247">Applicable evidence on 15 March</text>
      <text x="765" y="195" font-weight="bold">c5 — denial (−)</text>
      <text x="765" y="220">Support: 15 March; end unknown</text>
      <text x="765" y="247">Applicable evidence on 15 March</text>
      <text x="500" y="312" font-size="14">both address</text>
    </g>
    <rect x="230" y="329" width="540" height="67" rx="8" fill="#fff8e8" stroke="#806421" stroke-width="2"/>
    <text x="500" y="354" font-size="16" font-weight="bold">Shared proposition</text>
    <text x="500" y="378" font-size="16">Travel Policy v1 → applies to → Atlas</text>
    <rect x="125" y="448" width="750" height="91" rx="8" fill="#f4f1fa" stroke="#655181" stroke-width="2"/>
    <text x="500" y="473" font-size="16" font-weight="bold">Q4 answer under the cross-source policy</text>
    <text x="500" y="498" font-size="16">Sources disagree; withhold the applicability conclusion.</text>
    <text x="500" y="522" font-size="15">The answer follows from both assertions and the stated policy.</text>
  </g>
</svg>
